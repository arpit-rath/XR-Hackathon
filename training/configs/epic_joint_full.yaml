# Joint verb+noun ActionFormer, trained on all 495 EK-100 train videos (the version to ship if it wins).
# Everything except the joint-specific keys matches the released epic_slowfast_{verb,noun}.yaml.
dataset_name: epic_joint
model_name: LocPointTransformerJoint
train_split: ['training']
val_split: []
dataset: {
  json_file: ./data/epic_kitchens/annotations/joint/epic_joint_full.json,
  feat_folder: ./data/epic_kitchens/features,
  file_prefix: ~,
  file_ext: .npz,
  num_classes: 97,
  input_dim: 2304,
  feat_stride: 16,
  num_frames: 32,
  default_fps: 30,
  trunc_thresh: 0.3,
  crop_ratio: [0.9, 1.0],
  max_seq_len: 2304,
}
model: {
  regression_range: [[0, 4], [2, 8], [4, 16], [8, 32], [16, 64], [32, 10000]],
  fpn_type: identity,
  max_buffer_len_factor: 4.0,
  n_mha_win_size: 9,
  num_noun_classes: 300,
}
opt: {
  learning_rate: 0.0001,
  epochs: 16,
  weight_decay: 0.05,
}
loader: {
  batch_size: 2,
}
train_cfg: {
  init_loss_norm: 250,
  clip_grad_l2norm: 1.0,
  cls_prior_prob: 0.01,
  center_sample: radius,
  center_sample_radius: 1.5,
  label_smoothing: 0.0,
  noun_label_smoothing: 0.1,
  noun_loss_weight: 1.0,
}
test_cfg: {
  pre_nms_topk: 5000,
  max_seg_num: 2000,
  min_score: 0.001,
  nms_sigma : 0.4,
  multiclass_nms: True,
  pair_topk_verb: 5,
  pair_topk_noun: 10,
  pair_beta: 0.0,
  pair_prior_file: ./data/epic_kitchens/annotations/joint/pair_log_prior_full.npy,
}
output_folder: ./ckpt/
